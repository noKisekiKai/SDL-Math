        function checkAnswer(questionIndex, correctAnswer, explanation, button) {
            const selectedOption = document.querySelector(`input[name="q${questionIndex}"]:checked`);
            const resultDiv = document.getElementById(`result${questionIndex}`);
            
            if (!selectedOption) {
                showCustomAlert('❗ 請先選擇一個答案再檢查');
                return;
            }
            
            const selectedValue = parseInt(selectedOption.value);
            const isCorrect = selectedValue === correctAnswer;
            
            // Disable the button and all radio buttons for this question
            button.disabled = true;
            button.textContent = '已檢查 ✓';
            button.className = 'px-8 py-4 bg-gray-400 text-white rounded-xl font-bold text-lg cursor-not-allowed';
            
            document.querySelectorAll(`input[name="q${questionIndex}"]`).forEach(radio => {
                radio.disabled = true;
            });
            
            resultDiv.classList.remove('hidden');
            resultDiv.innerHTML = `
                <div class="p-6 rounded-xl border-2 ${isCorrect ? 
                    'bg-green-50 dark:bg-green-900/30 border-green-300 dark:border-green-700' : 
                    'bg-red-50 dark:bg-red-900/30 border-red-300 dark:border-red-700'
                } shadow-lg">
                    <div class="flex items-center mb-4">
                        <div class="text-3xl mr-3">${isCorrect ? '✅' : '❌'}</div>
                        <h3 class="text-2xl font-bold ${isCorrect ? 
                            'text-green-800 dark:text-green-300' : 
                            'text-red-800 dark:text-red-300'
                        }">
                            ${isCorrect ? '正確！做得很好！' : '答案不正確'}
                        </h3>
                    </div>
                    <div class="text-lg text-gray-700 dark:text-gray-300 leading-relaxed">
                        <strong>解釋：</strong>${explanation}
                    </div>
                </div>
            `;
        }

        function renderMath() {

                try {
                    renderMathInElement(document.getElementById('contentArea'), {
                        delimiters: [
                            {left: '$$', right: '$$', display: true},
                            {left: '$', right: '$', display: false},
                            {left: '\\[', right: '\\]', display: true},
                            {left: '\\(', right: '\\)', display: false}
                        ],
                        throwOnError: false,
                        errorColor: '#cc0000',
                        strict: false
                    });
                } catch (err) {
                    console.log('KaTeX render error:', err);
                }
            } else {
                setTimeout(renderMath, 100);
            }
        }

        // Interactive functions for number system
        function classifyNumber() {
            const input = document.getElementById('numberInput');
            const resultDiv = document.getElementById('classificationResult');
            
            if (!input || !resultDiv) return;
            
            const value = input.value.trim();
            
            if (!value) {
                resultDiv.className = 'mt-4 p-3 rounded-lg bg-gray-100 border border-gray-300';
                resultDiv.innerHTML = '⚠️ 請輸入一個數字';
                resultDiv.classList.remove('hidden');
                return;
            }
            
            let classification = '';
            let explanation = '';
            let bgColor = '';
            let borderColor = '';
            
            // Simple classification logic
            if (value.includes('π') || value.includes('√2') || value.includes('√3') || value.includes('√5') || value.includes('e')) {
                classification = '無理數 (Irrational Number)';
                explanation = '這是一個無理數，不能表示為兩個整數的比值，小數部分無限不循環。';
                bgColor = 'bg-orange-100';
                borderColor = 'border-orange-300';
            } else if (value.includes('/')) {
                classification = '有理數 (Rational Number)';
                explanation = '這是一個有理數，可以表示為兩個整數的比值 p/q (其中 q ≠ 0)。';
                bgColor = 'bg-green-100';
                borderColor = 'border-green-300';
            } else {
                const num = parseFloat(value);
                if (isNaN(num)) {
                    classification = '輸入錯誤';
                    explanation = '請輸入有效的數字格式。例如：3.14、√2、-5/7';
                    bgColor = 'bg-gray-100';
                    borderColor = 'border-gray-300';
                } else if (num > 0 && Number.isInteger(num)) {
                    classification = '自然數 (Natural Number)';
                    explanation = '這是一個自然數，也是正整數，同時也屬於整數、有理數和實數。';
                    bgColor = 'bg-red-100';
                    borderColor = 'border-red-300';
                } else if (Number.isInteger(num)) {
                    classification = '整數 (Integer)';
                    explanation = '這是一個整數，也屬於有理數和實數。';
                    bgColor = 'bg-blue-100';
                    borderColor = 'border-blue-300';
                } else {
                    classification = '有理數 (Rational Number)';
                    explanation = '這是一個有理數，可以表示為分數形式。';
                    bgColor = 'bg-green-100';
                    borderColor = 'border-green-300';
                }
            }
            
            resultDiv.className = `mt-4 p-3 rounded-lg ${bgColor} ${borderColor} border`;
            resultDiv.innerHTML = `
                <div class="font-bold text-gray-800 mb-2">🎯 分析結果：${classification}</div>
                <div class="text-gray-700 text-sm">${explanation}</div>
            `;
            resultDiv.classList.remove('hidden');
        }

        // Quadratic function interactive features
        function updateParabola() {
            const aSlider = document.getElementById('aSlider');
            const bSlider = document.getElementById('bSlider');
            const cSlider = document.getElementById('cSlider');
            
            if (!aSlider || !bSlider || !cSlider) return;
            
            let a = parseFloat(aSlider.value);
            const b = parseFloat(bSlider.value);
            const c = parseFloat(cSlider.value);
            
            // Prevent a from being zero
            if (Math.abs(a) < 0.1) a = a >= 0 ? 0.1 : -0.1;
            
            // Update display values
            const aValue = document.getElementById('aValue');
            const bValue = document.getElementById('bValue');
            const cValue = document.getElementById('cValue');
            
            if (aValue) aValue.textContent = `a = ${a}`;
            if (bValue) bValue.textContent = `b = ${b}`;
            if (cValue) cValue.textContent = `c = ${c}`;
            
            // Calculate properties
            const discriminant = b * b - 4 * a * c;
            const vertexX = -b / (2 * a);
            const vertexY = a * vertexX * vertexX + b * vertexX + c;
            
            // Update equation display
            let equation = 'y = ';
            if (a === 1) equation += 'x²';
            else if (a === -1) equation += '-x²';
            else equation += `${a}x²`;
            
            if (b !== 0) {
                if (b > 0) equation += ' + ';
                else equation += ' - ';
                equation += Math.abs(b) === 1 ? 'x' : `${Math.abs(b)}x`;
            }
            
            if (c !== 0) {
                if (c > 0) equation += ' + ';
                else equation += ' - ';
                equation += Math.abs(c);
            }
            
            const equationDisplay = document.getElementById('equationDisplay');
            if (equationDisplay) equationDisplay.textContent = equation;
            
            // Generate parabola path
            let pathData = 'M ';
            const scale = 30; // pixels per unit
            const centerX = 300;
            const centerY = 200;
            let first = true;
            
            for (let x = -8; x <= 8; x += 0.1) {
                const y = a * x * x + b * x + c;
                const screenX = centerX + x * scale;
                const screenY = centerY - y * scale;
                
                if (screenY >= 0 && screenY <= 400) {
                    if (first) {
                        pathData += `${screenX},${screenY}`;
                        first = false;
                    } else {
                        pathData += ` L ${screenX},${screenY}`;
                    }
                }
            }
            
            const parabolaPath = document.getElementById('parabolaPath');
            if (parabolaPath) parabolaPath.setAttribute('d', pathData);
            
            // Update vertex
            const vertexScreenX = centerX + vertexX * scale;
            const vertexScreenY = centerY - vertexY * scale;
            const vertex = document.getElementById('vertex');
            const vertexLabel = document.getElementById('vertexLabel');
            
            if (vertex && vertexScreenY >= 0 && vertexScreenY <= 400) {
                vertex.setAttribute('cx', vertexScreenX);
                vertex.setAttribute('cy', vertexScreenY);
                vertex.style.display = 'block';
            } else if (vertex) {
                vertex.style.display = 'none';
            }
            
            if (vertexLabel) {
                vertexLabel.setAttribute('x', vertexScreenX + 10);
                vertexLabel.setAttribute('y', vertexScreenY - 5);
                vertexLabel.textContent = `(${vertexX.toFixed(1)}, ${vertexY.toFixed(1)})`;
            }
            
            // Handle roots
            const root1 = document.getElementById('root1');
            const root2 = document.getElementById('root2');
            const root1Label = document.getElementById('root1Label');
            const root2Label = document.getElementById('root2Label');
            
            if (discriminant >= 0) {
                const sqrt_discriminant = Math.sqrt(discriminant);
                const rootValue1 = (-b + sqrt_discriminant) / (2 * a);
                const rootValue2 = (-b - sqrt_discriminant) / (2 * a);
                
                // Show roots
                const root1ScreenX = centerX + rootValue1 * scale;
                const root2ScreenX = centerX + rootValue2 * scale;
                
                if (root1 && root1ScreenX >= 0 && root1ScreenX <= 600) {
                    root1.setAttribute('cx', root1ScreenX);
                    root1.setAttribute('cy', centerY);
                    root1.style.display = 'block';
                } else if (root1) {
                    root1.style.display = 'none';
                }
                
                if (Math.abs(rootValue1 - rootValue2) > 0.01) {
                    if (root2 && root2ScreenX >= 0 && root2ScreenX <= 600) {
                        root2.setAttribute('cx', root2ScreenX);
                        root2.setAttribute('cy', centerY);
                        root2.style.display = 'block';
                    } else if (root2) {
                        root2.style.display = 'none';
                    }
                    
                    if (root1Label) {
                        root1Label.setAttribute('x', root1ScreenX);
                        root1Label.setAttribute('y', centerY - 15);
                        root1Label.textContent = `x₁=${rootValue1.toFixed(1)}`;
                        root1Label.style.display = 'block';
                    }
                    
                    if (root2Label) {
                        root2Label.setAttribute('x', root2ScreenX);
                        root2Label.setAttribute('y', centerY - 15);
                        root2Label.textContent = `x₂=${rootValue2.toFixed(1)}`;
                        root2Label.style.display = 'block';
                    }
                    
                    const rootsInfo = document.getElementById('rootsInfo');
                    if (rootsInfo) rootsInfo.textContent = `實根：x₁ = ${rootValue1.toFixed(2)}, x₂ = ${rootValue2.toFixed(2)}`;
                } else {
                    if (root2) root2.style.display = 'none';
                    
                    if (root1Label) {
                        root1Label.setAttribute('x', root1ScreenX);
                        root1Label.setAttribute('y', centerY - 15);
                        root1Label.textContent = `x=${rootValue1.toFixed(1)}`;
                        root1Label.style.display = 'block';
                    }
                    
                    if (root2Label) root2Label.style.display = 'none';
                    
                    const rootsInfo = document.getElementById('rootsInfo');
                    if (rootsInfo) rootsInfo.textContent = `重根：x = ${rootValue1.toFixed(2)}`;
                }
            } else {
                if (root1) root1.style.display = 'none';
                if (root2) root2.style.display = 'none';
                if (root1Label) root1Label.style.display = 'none';
                if (root2Label) root2Label.style.display = 'none';
                
                const rootsInfo = document.getElementById('rootsInfo');
                if (rootsInfo) rootsInfo.textContent = '無實根';
            }
            
            // Update analysis
            const discriminantInfo = document.getElementById('discriminantInfo');
            const vertexInfo = document.getElementById('vertexInfo');
            const openingDirection = document.getElementById('openingDirection');
            const symmetryAxis = document.getElementById('symmetryAxis');
            const yIntercept = document.getElementById('yIntercept');
            const domainRange = document.getElementById('domainRange');
            
            if (discriminantInfo) discriminantInfo.textContent = `判別式 Δ = ${discriminant.toFixed(2)}`;
            if (vertexInfo) vertexInfo.textContent = `頂點：(${vertexX.toFixed(2)}, ${vertexY.toFixed(2)})`;
            if (openingDirection) openingDirection.textContent = `開口方向：${a > 0 ? '向上 ↑' : '向下 ↓'}`;
            if (symmetryAxis) symmetryAxis.textContent = `對稱軸：x = ${vertexX.toFixed(2)}`;
            if (yIntercept) yIntercept.textContent = `y截距：${c}`;
            
            const range = a > 0 ? `[${vertexY.toFixed(2)}, +∞)` : `(-∞, ${vertexY.toFixed(2)}]`;
            if (domainRange) domainRange.textContent = `值域：${range}`;
        }
        
        function setQuadratic(a, b, c) {
            const aSlider = document.getElementById('aSlider');
            const bSlider = document.getElementById('bSlider');
            const cSlider = document.getElementById('cSlider');
            
            if (aSlider) aSlider.value = a;
            if (bSlider) bSlider.value = b;
            if (cSlider) cSlider.value = c;
            
            updateParabola();
        }
    </script>
